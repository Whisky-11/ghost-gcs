packages:
  - bridge
  - app

# next-app's own optional native/postinstall deps (image optimization sharp
# binary, unrs-resolver oxc-based resolver) — neither is required for our
# build/dev/test path (no next/image remote optimization used), so skip
# running their build scripts rather than interactively approving them.
ignoredBuiltDependencies:
  - sharp
  - unrs-resolver

# Dual-write of the root package.json's `pnpm.overrides` — pnpm 9.12 (this
# repo's pinned version) reads overrides from package.json; pnpm 10 moved
# the field here. Keep both in sync until we bump pnpm.
overrides:
  xml2js: ^0.6.2
  postcss: ^8.5.10
